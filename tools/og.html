<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Archivo:wght@300;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#FAF8F5;font-family:"Zen Kaku Gothic New",sans-serif;color:#1A1A1A;position:relative;overflow:hidden}
.l{position:absolute;left:80px;top:72px;bottom:72px;display:flex;flex-direction:column;justify-content:space-between}
.k{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.18em;color:#783C28}
h1{font-weight:900;font-size:150px;line-height:1;letter-spacing:-.01em}
.en{font-family:Archivo,sans-serif;font-weight:300;font-size:30px;letter-spacing:.42em;margin-top:18px;color:#56504A}
.a{font-size:30px;font-weight:700;line-height:1.5}
.a span{display:block;font-size:22px;font-weight:400;color:#56504A}
.bar{position:absolute;left:0;top:0;width:12px;height:100%;background:#783C28}
svg{position:absolute;right:-40px;top:55px;width:540px;height:540px}
.mk{position:absolute;right:70px;bottom:60px;font-family:Archivo,sans-serif;font-weight:500;letter-spacing:.32em;font-size:20px;color:#7A4033}
</style></head><body>
<div class="bar"></div>
<div class="l">
  <p class="k">ACCESS GUIDE — 行き方のご案内</p>
  <div><h1>未来庵</h1><p class="en">MIRAI-AN</p></div>
  <p class="a">京都市左京区吉田本町13<span>京阪「出町柳」駅・市バス「京大正門前」から</span></p>
</div>
<svg viewBox="0 0 400 400" id="s"></svg>
<p class="mk">MIRA TUKU</p>
<script>
var cols=['#F0A671','#F2C792','#F1C189','#CEA26F','#F8CDAC','#F0BE83','#EFC4A4','#F7BEA2','#DC8766','#B07256','#966D5E','#7A4033'],s=2011,o='';
function r(){s=(s*9301+49297)%233280;return s/233280}
for(var i=0;i<96;i++){var a=i*0.5+r()*0.25,R=14+i*1.75+r()*6,x=200+Math.cos(a)*R,y=200+Math.sin(a)*R,t=(a*180/Math.PI)+90+r()*30;
o+='<ellipse cx="'+x+'" cy="'+y+'" rx="7.5" ry="13.5" fill="'+cols[i%12]+'" transform="rotate('+t+' '+x+' '+y+')"/>';}
document.getElementById('s').innerHTML=o;
</script></body></html>
